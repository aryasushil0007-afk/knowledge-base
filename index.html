<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevDocs Search – Knowledge Base</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>DevDocs Search</h1>
      <p class="lead">Find answers across JavaScript, HTML, CSS, Git and web tooling docs.</p>

      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search by title or summary, e.g. “array”, “flexbox”…"
               aria-label="Search documentation" autocomplete="off">
        <kbd title="Press / to focus search">/</kbd>
      </div>

      <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
    </div>
  </header>

  <main class="wrap">
    <p id="status" class="status" aria-live="polite"></p>
    <section id="results" class="grid" aria-label="Search results"></section>

    <div id="emptyState" class="empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"/><path d="M16 4v4h4M8 13h8M8 17h5"/></svg>
      <h2>No articles found matching your query</h2>
      <p>Check the spelling, try a shorter keyword, or browse all categories.</p>
      <button id="resetBtn" type="button">Clear search</button>
    </div>
  </main>

  <footer class="wrap foot">Week 8 Milestone · In-memory knowledge base · Vanilla JavaScript</footer>
  <script src="script.js"></script>
</body>
</html>
